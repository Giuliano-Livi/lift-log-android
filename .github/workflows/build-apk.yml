name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build offline page
        run: python3 tools/build_page.py

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LiftLog.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lift Log 1.0.${{ github.run_number }}
          body: Download LiftLog.apk on your Android phone and open it to install or update.
          files: LiftLog.apk
          make_latest: true
