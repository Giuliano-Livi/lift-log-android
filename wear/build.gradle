plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liftlog.wear'
    compileSdk 36

    defaultConfig {
        // Same package and signing key as the phone app: required for the watch and phone to sync.
        applicationId 'com.liftlog.app'
        minSdk 30
        targetSdk 34
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('BUILD_NUMBER') ?: '1'}"
    }

    signingConfigs {
        release {
            storeFile file('../app/liftlog.keystore')
            storePassword 'liftlog-key'
            keyAlias 'liftlog'
            keyPassword 'liftlog-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    // tile (today's workout) and watch-face complication (rest timer)
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    implementation 'com.google.guava:guava:33.4.8-android'
}
