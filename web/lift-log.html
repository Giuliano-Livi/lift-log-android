<title>Lift Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of rounded navy cards over a deep background, floating pill navigation at the bottom
   with a raised gradient "+" button. Each training day carries one colour; purple is the app accent. */
:root {
  color-scheme: dark;
  --bg: #0c0f1d;
  --surface: #161a2c;
  --surface2: #1e2338;
  --surface3: #282e48;
  --line: rgba(255, 255, 255, .06);
  --ink: #f2f3f9;
  --muted: #8b91aa;
  --faint: #5d6380;
  --accent: #7b6cf6;
  --accent-hi: #a99cff;
  --good: #4fc28f;
  --warn: #f5a524;
  --bad: #f2647e;
  --info: #6a96f2;
  --danger: #f2647e;
  --focus: #a99cff;
  --shadow: rgba(0, 0, 0, .5);
  --day: var(--accent); --day-hi: var(--accent-hi); --on-day: #ffffff;
  --f-body: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --navh: 66px;
}
.d-push, .tn0  { --day: #8b7cf8; --day-hi: #b6aaff; --on-day: #ffffff; }
.d-pull, .tn1  { --day: #5b8def; --day-hi: #93b4fa; --on-day: #ffffff; }
.d-legs, .tn2  { --day: #f5a524; --day-hi: #ffcd70; --on-day: #1e1404; }
.d-upper, .tn3 { --day: #42b986; --day-hi: #7fdcb1; --on-day: #05170e; }
.tn4 { --day: #e8659e; --day-hi: #ff9cc8; --on-day: #ffffff; }
.tn5 { --day: #22b5c6; --day-hi: #6fdde9; --on-day: #03181b; }

* { box-sizing: border-box; }
body {
  background: var(--bg) radial-gradient(900px 520px at 85% -120px, rgba(123, 108, 246, .22), transparent 70%) no-repeat;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--navh) + 40px + env(safe-area-inset-bottom, 0px));
  font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 640px; margin: 0 auto; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg { display: block; }

/* header */
.top { padding-block: 14px 12px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--accent-hi), var(--accent)); box-shadow: 0 6px 16px rgba(123, 108, 246, .35);
}
.bname { font-weight: 600; font-size: 16px; letter-spacing: .01em; }
.sync {
  border: 0; background: var(--surface); border-radius: 99px; padding: 6px 12px; min-height: 32px;
  font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px;
}
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="saved"]::before { background: var(--good); box-shadow: 0 0 8px var(--good); }
.sync[data-s="saving"]::before { background: var(--warn); }
.sync[data-s="error"]::before { background: var(--bad); }
.sync[data-s="error"] { color: var(--bad); font-weight: 600; }
.ptitle h1 { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.ptitle p { color: var(--muted); font-size: 14px; margin-top: 2px; }

/* bottom navigation */
.tabs {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  height: var(--navh); border-radius: 26px; padding: 0 8px;
  background: rgba(22, 26, 44, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 12px 34px var(--shadow), inset 0 0 0 1px var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
}
.tabs [data-tab] {
  border: 0; background: transparent; color: var(--faint); height: 100%;
  display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 10.5px; font-weight: 500;
}
.tabs [data-tab] svg { width: 23px; height: 23px; }
.tabs [data-tab][aria-selected="true"] { color: var(--ink); }
.tabs [data-tab][aria-selected="true"] span::after {
  content: ""; display: block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent-hi); margin: 2px auto 0;
}
.fab {
  justify-self: center; width: 54px; height: 54px; border-radius: 19px; border: 0; color: #fff; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent-hi), var(--accent)); margin-top: -22px;
  box-shadow: 0 10px 24px rgba(123, 108, 246, .55), 0 0 0 5px var(--bg);
}
.fab svg { width: 26px; height: 26px; }
.fab.live { background: linear-gradient(135deg, #7bdcb0, #3fae7f); box-shadow: 0 10px 24px rgba(66, 185, 134, .45), 0 0 0 5px var(--bg); }

/* shared */
.view { display: grid; gap: 14px; padding-top: 4px; }
.card, .panel, .banner, details.sess {
  background: var(--surface); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--line);
}
.card { padding: 16px; display: grid; gap: 12px; }
.panel { padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 18px; font-weight: 600; }
.btn {
  border: 0; background: var(--surface2); border-radius: 99px; color: var(--ink);
  min-height: 44px; padding: 8px 18px; font-weight: 500; font-size: 14px;
}
.btn:hover { background: var(--surface3); }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: 13px; }
.btn.primary {
  background: linear-gradient(135deg, var(--day-hi), var(--day)); color: var(--on-day); font-weight: 600;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--day) 35%, transparent);
}
.btn.danger { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface2)); }
.btn[disabled] { opacity: .35; cursor: default; }
.muted { color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 4px; min-height: 32px; }
.msg { font-size: 13px; color: var(--muted); min-height: 1em; }
.subnote { font-size: 13px; color: var(--muted); }
.sub { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { color: var(--ink); }

/* tags */
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.k-up, .t-good { background: color-mix(in srgb, var(--good) 18%, transparent); color: #7fe0b2; }
.k-same, .k-new, .t-plain { background: var(--surface3); color: var(--ink); }
.k-down, .t-bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: #ff9aac; }
.k-deload, .t-info { background: color-mix(in srgb, var(--info) 20%, transparent); color: #a8c3ff; }
.t-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: #ffcf7a; }

/* log: plan + day + date */
.planbar {
  border: 0; width: 100%; text-align: left; background: var(--surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 58px; color: var(--ink);
}
.planbar .pt { display: grid; min-width: 0; flex: 1; }
.planbar .pk { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.planbar .pv { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.planbar .go { flex: none; font-size: 13px; font-weight: 500; color: var(--accent-hi); background: var(--surface2); border-radius: 99px; padding: 7px 14px; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 16px 30px; margin: -4px -16px -30px; scroll-padding-inline: 16px; }
.days::-webkit-scrollbar { display: none; }
.daychip {
  border: 0; background: var(--surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line);
  padding: 12px 4px 10px; display: grid; justify-items: center; gap: 4px; min-height: 76px;
  flex: 1 1 0; min-width: calc((100% - 24px) / 4);
}
.daychip .disc { width: 10px; height: 10px; border-radius: 50%; background: var(--day); box-shadow: 0 0 10px var(--day); }
.daychip .dn { font-weight: 600; font-size: 14px; max-width: 100%; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daychip .dw { font-size: 11px; color: var(--muted); }
.daychip[aria-pressed="true"] { background: linear-gradient(150deg, var(--day-hi), var(--day)); color: var(--on-day); box-shadow: 0 10px 24px color-mix(in srgb, var(--day) 35%, transparent); }
.daychip[aria-pressed="true"] .disc { background: var(--on-day); box-shadow: none; }
.daychip[aria-pressed="true"] .dw { color: var(--on-day); opacity: .8; }
.datebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.datebar label { font-size: 13px; color: var(--muted); }
.datebar input[type="date"], .lbl input, .lbl textarea, .picker select {
  min-height: 46px; border: 0; background: var(--surface2); border-radius: 14px; padding: 8px 14px; color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.datebar input[type="date"] { flex: 1 1 150px; min-width: 0; }
.summary { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 4px; }
.summary b { color: var(--ink); font-weight: 600; }

/* workout hero card */
.wk {
  background: linear-gradient(140deg, var(--day-hi), var(--day) 60%, color-mix(in srgb, var(--day) 70%, #000)) !important;
  color: var(--on-day); box-shadow: 0 14px 30px color-mix(in srgb, var(--day) 30%, transparent) !important;
  position: relative; overflow: hidden;
}
.wk::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255, 255, 255, .12); pointer-events: none;
}
.wk .small, .wk .muted { color: var(--on-day); opacity: .85; font-size: 13px; }
.wk .bigbtn {
  width: 100%; min-height: 54px; font-size: 16px; font-weight: 600; border: 0; border-radius: 99px;
  background: #fff; color: #1b1f33; box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
}
.wkhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
.wkhead .k { font-size: 13px; opacity: .85; }
.wkhead .big { font-size: 44px; font-weight: 600; line-height: 1.05; letter-spacing: -.02em; }
.wk .btn { background: rgba(255, 255, 255, .92); color: #1b1f33; box-shadow: none; }
.wk .btn.danger { background: #fff; color: #c2334b; }
.opts { display: grid; gap: 4px; position: relative; z-index: 1; }
.opt { display: flex; align-items: center; gap: 10px; font-size: 13.5px; min-height: 36px; cursor: pointer; }
.opt input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.wk .opt input { accent-color: #fff; }

/* exercise card */
.chead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.pic {
  position: relative; width: 72px; height: 72px; border-radius: 20px; flex: none;
  background: linear-gradient(150deg, color-mix(in srgb, var(--day) 30%, var(--surface2)), var(--surface2));
}
.pic svg { width: 100%; height: 100%; padding: 6px; }
.pic .f { stroke: var(--ink); stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.pic .hd { fill: var(--ink); }
.pic .q { stroke: var(--muted); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.pic .w { fill: var(--day-hi); }
.pic .wl { stroke: var(--day-hi); stroke-width: 4; fill: none; stroke-linecap: round; }
.pic .pn {
  position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; border-radius: 9px;
  background: var(--day); color: var(--on-day); box-shadow: 0 0 0 3px var(--surface);
  display: grid; place-items: center; font-weight: 600; font-size: 12px;
}
/* exercise drawings: start and end position side by side in one image, shown one at a time */
.pic .fr { position: absolute; inset: 5px; overflow: hidden; border-radius: 15px; }
.pic .fr img { display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 0 0; }
.pic.draw.sm .fr { inset: 3px; border-radius: 11px; }
@media (prefers-reduced-motion: no-preference) {
  .pic.anim .fr img { animation: exflip 2.8s steps(1, end) infinite; }
}
@keyframes exflip { 0% { object-position: 0 0; } 50% { object-position: 100% 0; } 100% { object-position: 0 0; } }
.chead .pic.draw { width: 84px; height: 84px; border-radius: 22px; }
.howbox { display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface2); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: st; display: grid; gap: 9px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 13.5px; line-height: 1.45; }
.steps li::before {
  content: counter(st); width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--day) 26%, var(--surface3)); color: var(--ink); font-size: 12px; font-weight: 600;
}
.tips { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.credit { font-size: 11.5px; color: var(--faint); line-height: 1.5; }
.credit a { color: var(--muted); }
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.chead h3 { font-size: 16.5px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.target { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.last { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.last .vals { color: var(--ink); }
.sugg, .prline { font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; color: var(--ink); }
.sugg { background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.sets { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 8px; align-items: center; }
.sn {
  width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 600; font-size: 13px; background: var(--surface2); color: var(--muted);
}
.set.filled .sn { background: linear-gradient(135deg, var(--day-hi), var(--day)); color: var(--on-day); }
.fld { position: relative; display: block; }
.fld .u { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
.fld input {
  width: 100%; min-height: 50px; border: 0; background: var(--surface2); border-radius: 14px;
  padding: 6px 14px 6px 48px; text-align: right; font-size: 19px; font-weight: 600; color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--line);
}
.fld input:focus { box-shadow: inset 0 0 0 2px var(--day); outline: none; }
.fld input::placeholder { color: var(--faint); font-weight: 500; }
.cfoot { display: flex; flex-wrap: wrap; gap: 8px; }
.swapbox { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface2); }
.swapbox .k { font-size: 13px; color: var(--muted); }
.swaplist { display: grid; gap: 6px; }
.swapopt {
  text-align: left; border: 0; background: var(--surface); border-radius: 14px;
  min-height: 46px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 500;
}
.swapopt small { font-weight: 500; color: var(--muted); font-size: 12px; }
.swapopt[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--day); }
.restrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.restrow .rl { font-size: 13px; color: var(--muted); }
.restrow .rv { font-size: 17px; font-weight: 600; min-width: 46px; text-align: center; }
.restrow .step { padding: 6px 12px; }
.restrow .restgo { margin-left: auto; background: color-mix(in srgb, var(--day) 22%, var(--surface2)); }
.note { padding: 16px; }
.note textarea {
  width: 100%; min-height: 84px; resize: vertical; border: 0; background: var(--surface2); color: var(--ink);
  border-radius: 14px; padding: 12px 14px;
}
.note label { font-weight: 600; font-size: 15px; }
.foot { font-size: 12px; color: var(--faint); text-align: center; }

/* plans, plan editor, exercise library */
.subnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.subnav .back { padding-left: 12px; }
.plan.on { box-shadow: inset 0 0 0 2px var(--accent); }
.phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.phead h3 { font-size: 17px; font-weight: 600; line-height: 1.25; }
.pdays { display: flex; flex-wrap: wrap; gap: 6px; }
.pday { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; padding: 5px 11px; border-radius: 99px; background: var(--surface2); }
.pday i { width: 8px; height: 8px; border-radius: 50%; background: var(--day); flex: none; }
.eday { box-shadow: inset 3px 0 0 var(--day), inset 0 0 0 1px var(--line); }
.dhead { display: flex; align-items: center; gap: 8px; }
.tone {
  width: 34px; height: 34px; border-radius: 12px; border: 0; flex: none;
  background: linear-gradient(135deg, var(--day-hi), var(--day)); box-shadow: 0 6px 14px color-mix(in srgb, var(--day) 35%, transparent);
}
.dlabel, .pname {
  flex: 1; width: 0; min-width: 0; min-height: 44px; border: 0; border-radius: 14px; background: var(--surface2); color: var(--ink);
  padding: 8px 12px; font-weight: 600; font-size: 16px; box-shadow: inset 0 0 0 1px var(--line);
}
.pname { width: 100%; font-size: 18px; }
.ib {
  width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--surface2); color: var(--ink); flex: none;
  display: grid; place-items: center; font-size: 15px;
}
.ib[disabled] { opacity: .3; cursor: default; }
.ib.x { color: #ff9aac; }
.elist { display: grid; gap: 8px; }
.erow { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; background: var(--surface2); border-radius: 18px; padding: 8px; }
.erow .pic { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(150deg, color-mix(in srgb, var(--day) 30%, var(--surface3)), var(--surface3)); }
.erow .nm { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 13.5px; line-height: 1.3; color: var(--ink); min-height: 36px; }
.erow .ebtns { display: flex; gap: 4px; }
.erow .ebtns .ib { background: var(--surface3); }
.nums { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); padding: 2px 2px 0; }
.nums input, .nums select {
  min-height: 38px; border: 0; border-radius: 11px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: 15px;
  box-shadow: inset 0 0 0 1px var(--line);
}
.nums input { width: 44px; text-align: center; padding: 0 4px; }
.nums select { padding: 0 8px; }
.nums .grp { display: inline-flex; align-items: center; gap: 6px; }
.libtools { display: grid; gap: 10px; }
.search {
  width: 100%; min-height: 48px; border: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
  padding: 8px 14px; box-shadow: inset 0 0 0 1px var(--line); font-size: 15px;
}
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px; margin: -2px -16px; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 0; background: var(--surface); border-radius: 99px; min-height: 36px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.chips button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent-hi), var(--accent)); color: #fff; box-shadow: none; }
.lib { display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); padding: 7px 10px 7px 7px; }
.lopen { border: 0; background: none; color: var(--ink); padding: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; min-height: 56px; }
.lrow .pic { width: 56px; height: 56px; border-radius: 15px; }
.lt { display: grid; gap: 2px; min-width: 0; }

          h('figure', null, h('img', { src: c.img, alt: c.name + ', start position' }), h('figcaption', { text: 'Start' })),
          h('figure', { class: 'end' }, h('img', { src: c.img, alt: c.name + ', end position' }), h('figcaption', { text: 'Finish' })))
      : h('div', { class: 'exhero one' }, picEl(id, null, false));
    var hist = historyFor(id, '9999-12-31'), mine = null;
    if (hist.length) {
      var b = bestBefore(id, '9999-12-31');
      mine = h('section', { class: 'panel' }, h('h2', { text: 'Your numbers' }),
        h('div', { class: 'tiles' },
          tile('Sessions', String(hist.length), ''),
          b.e1 > 0 ? tile('Best est. 1RM', fmt(b.e1), 'kg') : tile('Best reps', String(b.reps), ''),
          tile('Last', fmtShort(hist[0].date), '')),
        h('p', { class: 'last' }, h('span', { text: 'Last time:' }), h('span', { class: 'vals', text: setText(hist[0].sets, c.bw) })));
    }
    var used = [];
    plansList().forEach(function (p) {
      p.days.forEach(function (d) { if ((d.slots || []).some(function (s) { return s.id === id; })) used.push(p.name + ' · ' + d.label); });
    });
    var inDay = t && t.day.slots.some(function (s) { return s.id === id; });
    v.replaceChildren(
      subnav(t ? h('button', { type: 'button', class: 'btn small primary', disabled: inDay, text: inDay ? 'Added ✓' : 'Add to ' + (t.day.label || 'day'), onclick: function () {
        addToDay(t, id); backView();
      } }) : null),
      hero,
      h('div', { class: 'facts' },
        (c.muscles || []).map(function (m) { return h('span', { class: 'tag t-plain', text: MUSCLE_NAMES[m] || m }); }),
        (c.eq || []).map(function (x) { return h('span', { class: 'tag t-info', text: EQ_NAMES[x] || x }); }),
        c.type ? h('span', { class: 'tag t-plain', text: c.type === 'compound' ? 'Compound' : 'Isolation' }) : null),
      h('section', { class: 'panel' }, h('h2', { text: 'How to do it' }), stepsEl(c),
        c.tips && c.tips.length ? h('ul', { class: 'tips' }, c.tips.map(function (x) { return h('li', { text: x }); })) : null,
        h('div', { class: 'acts' }, jefitLink(c.name)),
        creditEl(c)),
      mine,
      used.length ? h('section', { class: 'panel' }, h('h2', { text: 'In your plans' }), h('div', { class: 'pdays' }, used.map(function (u) { return h('span', { class: 'pday', text: u }); }))) : null);
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll('.tabs [data-tab]').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
  $('#fab').addEventListener('click', function () {
    var a = activeSession();
    if (a) {
      if (!a.isDraft && a.doc) { flush(); state.day = a.doc.day; state.dayPicked = true; state.date = a.doc.date; reloadDraft(); }
      setTab('log');
      return;
    }
    flush();
    if (state.date !== todayISO()) { state.date = todayISO(); state.dayPicked = false; state.day = defaultDay(); reloadDraft(); }
    setTab('log');
    if (!state.draft.endedAt) startWorkout();
    window.scrollTo(0, 0);
  });
  $('#sync').addEventListener('click', function () {
    if (state.status === 'error') { state.dirty = true; flush(); return; }
    setTab('history');
    var el = document.getElementById('dataPanel');
    if (el) el.scrollIntoView({ block: 'start' });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flush();
    else { if (activeSession()) keepAwake(); updateTimes(); }
  });
  $('#restMinus').addEventListener('click', function () { adjustRest(-15); });
  $('#restPlus').addEventListener('click', function () { adjustRest(15); });
  $('#restSkip').addEventListener('click', skipRest);
  $('#dockFinish').addEventListener('click', finishWorkout);
  window.addEventListener('pagehide', flush);
  var rz = null;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { drawChart('chart'); drawChart('bchart'); drawChart('dchart'); }, 150); });

  reloadDraft();
  render();
  init();
})();
</script>
