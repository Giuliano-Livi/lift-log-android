plugins {
    id 'com.android.application'
}

android {
    namespace 'com.liftlog.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.liftlog.app'
        minSdk 26
        targetSdk 34
        // CI passes the run number so every new APK installs over the old one
        versionCode((System.getenv('BUILD_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('BUILD_NUMBER') ?: '1'}"
    }

    signingConfigs {
        release {
            // Personal sideload key, kept in the repo so every build can update the installed app.
            storeFile file('liftlog.keystore')
            storePassword 'liftlog-key'
            keyAlias 'liftlog'
            keyPassword 'liftlog-key'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
